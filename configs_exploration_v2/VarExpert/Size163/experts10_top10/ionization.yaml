data:
  kind: volume
  dataset_name: ionization
  split: train
  volume_shape:
    X: 600
    Y: 248
    Z: 248
    T: 100
  targets:
    GT: ${REPO_ROOT}/data/Volume/Ionization/target_GT.npy
    H_plus: ${REPO_ROOT}/data/Volume/Ionization/target_H+.npy
    H2: ${REPO_ROOT}/data/Volume/Ionization/target_H2.npy
    He: ${REPO_ROOT}/data/Volume/Ionization/target_He.npy
    PD: ${REPO_ROOT}/data/Volume/Ionization/target_PD.npy
model:
  name: var_expert
  in_features: 4
  num_experts: 10
  base_dim: 20
  top_k: 10
training:
  epochs: 50
  batch_size: 16000
  pred_batch_size: 16000
  num_workers: 0
  lr: 5.0e-05
  val_split: 0.0
  log_every: 1
  log_psnr_every: 5
  psnr_sample_ratio: 0.01
  save_every: 50
  early_stop_patience: 0
  loss_type: mse
  seed: 42
  sampler: budgeted_random
  batches_per_epoch_budget: 1500
  scheduler:
    enabled: true
    step_size: 40
    gamma: 0.92
  multiview_ema_loss:
    enabled: true
    beta: 0.95
    eps: 1.0e-08
    w_min: 0.2
    w_max: 5.0
    warmup_steps: 45000
    alpha: 5.0
  pretrain:
    enabled: true
    epochs: 5
    lr: 5.0e-05
    cluster_seed: 42
    assignments_cache_path: ${REPO_ROOT}/data/cache/ionization_voxel_assignments_10.npy
evaluation:
  batch_size: 16000
  save_predictions: false
log:
  timing:
    enabled: true
    epoch_breakdown: true
    step_window: false
    step_window_every_steps: 100
    cuda_sync: false
experiment: exploration_v2_varexpert_size163_experts10_top10
exp_id: explore-v2-varexpert-size163-experts10_top10
experiment_root: ${REPO_ROOT}/runs/exploration_v2
exploration_probe:
  enabled: true
  total_epoch_equivalents: 50
  every_epoch_equivalents: 5
  sample_ratio: 0.01
  max_samples: 100000
  seed: 42
