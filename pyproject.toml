[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "var-expert-inr"
version = "0.1.0"
description = "Unified INR framework for node and volume datasets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pyyaml",
  "torch",
  "scikit-learn",
  "psutil>=5.9",
]

[project.optional-dependencies]
evaluation = [
  "Pillow>=9",
  "scikit-image>=0.20",
  "lpips>=0.1.4",
  "pyvista>=0.43",
  "vtk>=9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"var_expert_inr.evaluation" = ["profiles/*.yaml"]
"var_expert_inr.methods.miner" = ["LICENSE.MINER"]
