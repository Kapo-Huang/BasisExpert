experiment: exploration_apmgsrn_balanced-H_plus
exp_id: explore-apmgsrn-size163-balanced-H_plus
experiment_root: ${REPO_ROOT}/runs/exploration
MODEL:
  model_name: apmgsrn
  n_dims: 3
  n_outputs: 1
  feature_grid_shape:
  - 4
  - 4
  - 4
  n_features: 14
  n_grids: 1
  nodes_per_layer: 16
  n_layers: 3
  use_bias: false
  use_tcnn_if_available: true
  grid_initialization: default
  requires_padded_feats: true
DATA:
  dataset_name: ionization
  target: H_plus
  targets:
    GT: ${REPO_ROOT}/data/Volume/Ionization/target_GT.npy
    H_plus: ${REPO_ROOT}/data/Volume/Ionization/target_H+.npy
    H2: ${REPO_ROOT}/data/Volume/Ionization/target_H2.npy
    He: ${REPO_ROOT}/data/Volume/Ionization/target_He.npy
    PD: ${REPO_ROOT}/data/Volume/Ionization/target_PD.npy
  volume_shape:
    X: 600
    Y: 248
    Z: 248
    T: 100
  align_corners: true
TRAINING:
  iterations: 750
  points_per_iteration: 16000
  prediction_points_per_batch: 16000
  lr: 0.01
  beta_1: 0.9
  beta_2: 0.99
  device: cuda:0
  data_device: same
  save_every: 750
  log_every: 75
  time_indices: all
  seed: 42
  early_stopping: false
EVALUATION:
  run_after_training: false
exploration_probe:
  enabled: true
  total_epoch_equivalents: 50
  every_epoch_equivalents: 5
  sample_ratio: 0.01
  max_samples: 100000
  seed: 42
