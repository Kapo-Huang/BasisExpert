experiment: exploration_v5_instantvnr_official_default_lr1e3_fast_decay_GT
exp_id: explore-v5-instantvnr-official-default-lr1e3-fast-decay-GT
experiment_root: ${REPO_ROOT}/runs/exploration_v5
data:
  kind: volume
  dataset_name: ionization
  split: train
  volume_shape:
    X: 600
    Y: 248
    Z: 248
    T: 100
  targets:
    GT: ${REPO_ROOT}/data/Volume/Ionization/target_GT.npy
  target: GT
model:
  name: instant_vnr
  in_features: 4
  out_features: 1
  n_levels: 8
  n_features_per_level: 8
  base_resolution: 16
  per_level_scale: 2.0
  log2_hashmap_size: 19
  hidden_features: 64
  hidden_layers: 4
training:
  epochs: 50
  batch_size: 16000
  pred_batch_size: 16000
  num_workers: 0
  lr: 0.001
  val_split: 0.0
  log_every: 1
  log_psnr_every: 5
  psnr_sample_ratio: 0.01
  save_every: 50
  early_stop_patience: 0
  loss_type: l1
  seed: 42
  sampler: budgeted_random
  batches_per_epoch_budget: 1500
  scheduler:
    enabled: true
    interval: optimizer_step
    step_size: 1000
    decay_start: 2000
    gamma: 0.9
  gradient_accumulation_steps: 4
  beta_1: 0.9
  beta_2: 0.999
  epsilon: 1.0e-15
  weight_decay: 1.0e-06
  pretrain:
    enabled: false
evaluation:
  batch_size: 16000
  save_predictions: false
log:
  timing:
    enabled: true
    epoch_breakdown: true
    step_window: false
    step_window_every_steps: 100
    cuda_sync: false
exploration_probe:
  enabled: true
  total_epoch_equivalents: 50
  every_epoch_equivalents: 5
  sample_ratio: 0.01
  max_samples: 100000
  seed: 42
