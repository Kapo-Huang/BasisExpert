experiment: katrina_mvnet
exp_id: mvnet-katrina
experiment_root: ${REPO_ROOT}/runs
data:
  kind: node
  dataset_name: katrina
  split: train
  coords_path: ${REPO_ROOT}/data/Mesh/Katrina/source_XYZT.npy
  targets:
    fort63: ${REPO_ROOT}/data/Mesh/Katrina/target_fort63.npy
    fort64: ${REPO_ROOT}/data/Mesh/Katrina/target_fort64.npy
    fort73: ${REPO_ROOT}/data/Mesh/Katrina/target_fort73.npy
    speed: ${REPO_ROOT}/data/Mesh/Katrina/target_speed.npy
    v: ${REPO_ROOT}/data/Mesh/Katrina/target_v.npy
model:
  name: mvnet
  in_features: 4
  out_features: 5
  hidden_features: 120
  num_residual_blocks: 10
  omega_0: 30.0
  bias: true
training:
  epochs: 300
  batch_size: 2048
  pred_batch_size: 16000
  gradient_accumulation_steps: 1
  num_workers: 0
  lr: 0.0001
  beta_1: 0.9
  beta_2: 0.999
  epsilon: 1.0e-08
  weight_decay: 0.0
  val_split: 0.0
  log_every: 10
  log_psnr_every: 0
  psnr_sample_ratio: 0.1
  save_every: 300
  early_stop_patience: 0
  loss_type: mse
  seed: 42
  sampler: budgeted_random
  batches_per_epoch_budget: 1500
  scheduler:
    enabled: true
    interval: epoch
    step_size: 15
    gamma: 0.8
  pretrain:
    enabled: false
evaluation:
  batch_size: 16000
  save_predictions: false
log:
  timing:
    enabled: true
    epoch_breakdown: true
    step_window: false
    step_window_every_steps: 100
    cuda_sync: false
