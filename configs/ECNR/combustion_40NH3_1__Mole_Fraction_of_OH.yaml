experiment: ecnr_combustion_40NH3_1_Mole_Fraction_of_OH
exp_id: ecnr-combustion_40NH3_1-Mole_Fraction_of_OH
experiment_root: ${REPO_ROOT}/runs/ecnr
data:
  kind: volume
  dataset_name: combustion_40NH3_1
  split: train
  volume_shape:
    X: 128
    Y: 128
    Z: 1
    T: 2001
  targets:
    Absolute_Pressure: ${REPO_ROOT}/data/Volume/Combustion/target_Absolute_Pressure.npy
    Chemistry_Heat_Release_Rate: ${REPO_ROOT}/data/Volume/Combustion/target_Chemistry_Heat_Release_Rate.npy
    Mole_Fraction_of_CH4: ${REPO_ROOT}/data/Volume/Combustion/target_Mole_Fraction_of_CH4.npy
    Mole_Fraction_of_CO: ${REPO_ROOT}/data/Volume/Combustion/target_Mole_Fraction_of_CO.npy
    Mole_Fraction_of_CO2: ${REPO_ROOT}/data/Volume/Combustion/target_Mole_Fraction_of_CO2.npy
    Mole_Fraction_of_H2O: ${REPO_ROOT}/data/Volume/Combustion/target_Mole_Fraction_of_H2O.npy
    Mole_Fraction_of_NH2: ${REPO_ROOT}/data/Volume/Combustion/target_Mole_Fraction_of_NH2.npy
    Mole_Fraction_of_NH3: ${REPO_ROOT}/data/Volume/Combustion/target_Mole_Fraction_of_NH3.npy
    Mole_Fraction_of_OH: ${REPO_ROOT}/data/Volume/Combustion/target_Mole_Fraction_of_OH.npy
    Pressure: ${REPO_ROOT}/data/Volume/Combustion/target_Pressure.npy
    Temperature: ${REPO_ROOT}/data/Volume/Combustion/target_Temperature.npy
    Velocity_Magnitude: ${REPO_ROOT}/data/Volume/Combustion/target_Velocity_Magnitude.npy
  target: Mole_Fraction_of_OH
model:
  name: ecnr
  scales: 3
  block_shape_xyz:
  - 16
  - 16
  - 1
  residual_threshold: 0.0001
  gaussian_kernel_size: 5
  gaussian_sigma: 1.0
  gaussian_padding: reflect
  latent_dim: 8
  hidden_features: 24
  hidden_layers: 3
  omega_0: 30.0
  target_blocks_per_mlp:
  - 8
  - 16
  - 32
clustering:
  distance: squared_euclidean
  input: normalized_block_values
  initialization: kmeans_pp
  seed: 42
  balancing_passes: 1
  centroid_dtype: float32
  tie_break: lowest_cluster_index
  n_init: 1
  max_iter: 300
  tol: 0.0001
  algorithm: lloyd
training:
  epochs_per_scale: 500
  batch_size: 3200
  batches_per_epoch_budget: 3000
  primary_sample_budget: 14400000000
  lr: 0.001
  beta_1: 0.9
  beta_2: 0.999
  weight_decay: 2.0e-05
  pruning_epochs:
  - 150
  - 225
  - 300
  - 375
  pruning_sparsities:
  - 0.3
  - 0.4
  - 0.45
  - 0.5
  pruning_loss_weight: 0.1
  pruning_lr_gamma: 0.75
  quantization_finetune_epochs: 75
  quantization_finetune_batches_per_epoch: 0
  quantization_finetune_lr: 1.0e-05
  save_every: 0
  log_every: 10
  seed: 42
  device: cuda
quantization:
  mlp_weight_bits: 8
  mlp_bias_bits: 8
  latent_bits: 0
  cnn_bits: 9
  entropy: huffman
cnn:
  implementation_choice: fixed_for_underspecified_method_detail
  dimensionality: 3d
  layers: 5
  hidden_channels: 32
  kernel_size: 3
  stride: 1
  padding: 1
  dilation: 1
  bias: true
  hidden_activation: relu
  output_activation: none
  halo: 5
  tile_core_shape_zyx:
  - 32
  - 64
  - 64
  epochs: 100
  lr: 1.0e-05
evaluation:
  batch_size: 3200
  save_predictions: false
  run_after_training: false
  default_model: artifact
log:
  effective_config: true
  epoch_summary: true
  startup_timing: true
