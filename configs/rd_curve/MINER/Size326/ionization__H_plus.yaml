experiment: miner_ionization_size326_H_plus
exp_id: miner-ionization-size326-H_plus
experiment_root: ${RUNS_ROOT}/miner
data:
  kind: volume
  dataset_name: ionization
  split: train
  target: H_plus
  targets:
    GT: ${IONIZATION_ROOT}/target_GT.npy
    H_plus: ${IONIZATION_ROOT}/target_H+.npy
    H2: ${IONIZATION_ROOT}/target_H2.npy
    He: ${IONIZATION_ROOT}/target_He.npy
    PD: ${IONIZATION_ROOT}/target_PD.npy
  volume_shape:
    X: 600
    Y: 248
    Z: 248
    T: 100
model:
  name: miner
  scales: 4
  block_size: 40
  hidden_features: 6
  hidden_layers: 2
  omega_0: 30.0
  coordinate_type: local
  propagation: coarse_to_fine
  carry_start_scale: 2
  coarse_feature_multiplier: 4
training:
  epochs_per_scale: 2000
  lr: 0.001
  beta_1: 0.9
  beta_2: 0.999
  block_mse_threshold: 0.0002
  scale_convergence_delta: 2.0e-06
  global_mse_threshold: 0.0
  lr_decay: 0.999
  max_active_blocks_per_step: 2048
  time_indices: all
  seed: 42
  device: cuda
  log_every: 25
  save_intermediate_checkpoints: false
evaluation:
  save_predictions: false
  run_after_training: false
  default_model: checkpoint
log:
  effective_config: true
  startup_timing: true
  epoch_summary: true
