experiment: ionization_stsr_inr_size163
exp_id: stsr-inr-ionization-size163
experiment_root: ${RUNS_ROOT}
data:
  kind: volume
  dataset_name: ionization
  split: train
  volume_shape:
    X: 600
    Y: 248
    Z: 248
    T: 100
  targets:
    GT: ${IONIZATION_ROOT}/target_GT.npy
    H_plus: ${IONIZATION_ROOT}/target_H+.npy
    H2: ${IONIZATION_ROOT}/target_H2.npy
    He: ${IONIZATION_ROOT}/target_He.npy
    PD: ${IONIZATION_ROOT}/target_PD.npy
model:
  name: stsr_inr
  in_features: 4
  init_features: 64
  num_res: 5
  omega_0: 5.0
  embedding_dims: 256
  outermost_linear: true
  use_global_latent: true
training:
  epochs: 300
  batch_size: 2048
  pred_batch_size: 16000
  gradient_accumulation_steps: 1
  num_workers: 0
  lr: 1.0e-05
  beta_1: 0.9
  beta_2: 0.999
  epsilon: 1.0e-08
  weight_decay: 0.0
  val_split: 0.0
  log_every: 10
  log_psnr_every: 0
  psnr_sample_ratio: 0.1
  save_every: 0
  early_stop_patience: 0
  loss_type: mse
  seed: 42
  sampler: budgeted_random
  batches_per_epoch_budget: 1500
  scheduler:
    enabled: true
    interval: epoch
    step_size: 40
    gamma: 0.92
  pretrain:
    enabled: false
evaluation:
  batch_size: 16000
  save_predictions: false
log:
  timing:
    enabled: true
    epoch_breakdown: true
    step_window: false
    step_window_every_steps: 100
    cuda_sync: false
