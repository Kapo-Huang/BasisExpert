experiment: ionization_var_expert_size163
exp_id: var-expert-ionization-size163
experiment_root: ${RUNS_ROOT}
data:
  kind: volume
  dataset_name: ionization
  split: train
  volume_shape:
    X: 600
    Y: 248
    Z: 248
    T: 100
  targets:
    GT: ${IONIZATION_ROOT}/target_GT.npy
    H_plus: ${IONIZATION_ROOT}/target_H+.npy
    H2: ${IONIZATION_ROOT}/target_H2.npy
    He: ${IONIZATION_ROOT}/target_He.npy
    PD: ${IONIZATION_ROOT}/target_PD.npy
model:
  name: var_expert
  in_features: 4
  num_experts: 8
  base_dim: 22
  top_k: 4
training:
  epochs: 600
  batch_size: 16000
  pred_batch_size: 16000
  num_workers: 0
  lr: 5.0e-05
  val_split: 0.0
  log_every: 10
  log_psnr_every: 25
  psnr_sample_ratio: 0.1
  save_every: 0
  early_stop_patience: 0
  loss_type: mse
  seed: 42
  sampler: budgeted_random
  batches_per_epoch_budget: 1500
  scheduler:
    enabled: true
    step_size: 40
    gamma: 0.92
  multiview_ema_loss:
    enabled: true
    beta: 0.99
    eps: 1.0e-08
    w_min: 0.5
    w_max: 2.0
    warmup_steps: 75000
    alpha: 1.0
  pretrain:
    enabled: true
    epochs: 5
    lr: 5.0e-05
    cluster_seed: 42
    assignments_cache_path: ${REPO_ROOT}/data/cache/ionization_voxel_assignments_8.npy
evaluation:
  batch_size: 16000
  save_predictions: false
log:
  timing:
    enabled: true
    epoch_breakdown: true
    step_window: false
    step_window_every_steps: 100
    cuda_sync: false
