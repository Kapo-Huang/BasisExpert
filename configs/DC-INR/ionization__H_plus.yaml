experiment: dc_inr_ionization_H_plus
exp_id: dc-inr-ionization-H_plus
experiment_root: runs/dc_inr
data:
  kind: volume
  dataset_name: ionization
  split: train
  target: H_plus
  targets:
    GT: ../../data/Volume/Ionization/target_GT.npy
    H_plus: ../../data/Volume/Ionization/target_H+.npy
    H2: ../../data/Volume/Ionization/target_H2.npy
    He: ../../data/Volume/Ionization/target_He.npy
    PD: ../../data/Volume/Ionization/target_PD.npy
  volume_shape:
    X: 600
    Y: 248
    Z: 248
    T: 100
model:
  name: dc_inr
partition:
  candidate_block_shapes:
  - sx: 150
    sy: 8
    sz: 124
  - sx: 150
    sy: 124
    sz: 8
  - sx: 300
    sy: 4
    sz: 124
  - sx: 300
    sy: 124
    sz: 4
  dbscan_eps: 0.01
  dbscan_min_samples: 1
  entropy_bins: 256
  distance_matrix_max_bytes: 1073741824
compression:
  max_initial_neurons: 2048
  min_initial_neurons: 4
  target_cr: 20.0
training:
  epochs: 300
  total_steps: 900000
  batch_size: 16000
  lr: 0.0001
  beta_1: 0.9
  beta_2: 0.999
  points_per_timestep: 160
  prediction_batch_size: 16000
  lr_milestones:
  - 450000
  - 675000
  lr_gamma: 0.5
  log_every: 100
  seed: 42
  device: cuda
evaluation:
  batch_size: 16000
  save_predictions: true
