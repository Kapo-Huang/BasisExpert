experiment: node_var_expert_example
exp_id: var-expert-node-example
experiment_root: runs
data:
  kind: node
  dataset_name: node_example
  split: train
  coords_path: ./data/node/train/coords.npy
  targets:
    pressure: ./data/node/train/target_pressure.npy
    velocity: ./data/node/train/target_velocity.npy
model:
  name: var_expert
  in_features: 4
  num_experts: 4
  base_dim: 8
  top_k: 2
  decoder_num_layers: 2
training:
  epochs: 50
  batch_size: 8192
  pred_batch_size: 8192
  num_workers: 0
  lr: 5.0e-5
  val_split: 0.1
  log_every: 5
  save_every: 25
  loss_type: mse
  seed: 42
  sampler: uniform_random
  pretrain:
    enabled: false
    epochs: 0
evaluation:
  batch_size: 8192
  save_predictions: true

