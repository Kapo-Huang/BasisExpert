experiment: mesh_linkage_p_var_expert
exp_id: var-expert-linkage-p
experiment_root: runs
data:
  kind: node
  dataset_name: linkage_p
  split: train
  coords_path: ../../data/Mesh/Linkage-P/source_point_XYZT.npy
  targets:
    point_RF: ../../data/Mesh/Linkage-P/target_point_RF.npy
    point_U: ../../data/Mesh/Linkage-P/target_point_U.npy
model:
  name: var_expert
  in_features: 4
  num_experts: 7
  base_dim: 4
  top_k: 2
  expert_num_layers: 2
  decoder_num_layers: 2
training:
  epochs: 60
  batch_size: 8192
  pred_batch_size: 8192
  num_workers: 0
  lr: 5.0e-5
  log_every: 1
  save_every: 10
  loss_type: mse
  seed: 42
  sampler: uniform_random
  pretrain:
    enabled: false
    epochs: 0
evaluation:
  batch_size: 8192
  save_predictions: true

