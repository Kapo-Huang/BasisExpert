experiment: volume_var_expert_example
exp_id: var-expert-volume-example
experiment_root: runs
data:
  kind: volume
  dataset_name: volume_example
  split: train
  volume_shape:
    X: 600
    Y: 248
    Z: 248
    T: 2
  target_dir: ./data/volume/train
model:
  name: var_expert
  in_features: 4
  num_experts: 6
  base_dim: 16
  top_k: 3
training:
  epochs: 200
  batch_size: 8000
  pred_batch_size: 8000
  num_workers: 0
  lr: 1.0e-4
  val_split: 0.1
  log_every: 10
  save_every: 100
  loss_type: mse
  seed: 42
  sampler: budgeted_random
  batches_per_epoch_budget: 200
  pretrain:
    enabled: true
    epochs: 5
    lr: 5.0e-5
    cluster_seed: 42
evaluation:
  batch_size: 8000
  save_predictions: true

