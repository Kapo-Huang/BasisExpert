experiment: mesh_linkage_c_light_basis_expert
exp_id: light_basis_expert-linkage-c
experiment_root: runs
data:
  kind: node
  dataset_name: linkage_c
  split: train
  coords_path: ../../data/Mesh/Linkage-C/source_cell_XYZT.npy
  targets:
    cell_E: ../../data/Mesh/Linkage-C/target_cell_E.npy
    cell_E_IntegrationPoints: ../../data/Mesh/Linkage-C/target_cell_E_IntegrationPoints.npy
    cell_S: ../../data/Mesh/Linkage-C/target_cell_S.npy
    cell_S_IntegrationPoints: ../../data/Mesh/Linkage-C/target_cell_S_IntegrationPoints.npy
model:
  name: light_basis_expert
  in_features: 4
  num_experts: 6
  base_dim: 8
  top_k: 3
  expert_num_frequencies: 6
  expert_num_layers: 3
  gate_num_layers: 3
  decoder_num_layers: 3
  head_num_layers: 2
training:
  epochs: 600
  batch_size: 8192
  pred_batch_size: 8192
  num_workers: 0
  lr: 5.0e-5
  log_every: 10
  log_psnr_every: 10
  psnr_sample_ratio: 0.1
  save_every: 300
  loss_type: mse
  seed: 42
  sampler: uniform_random
  multiview_ema_loss:
    enabled: true
    beta: 0.95
    eps: 1.0e-8
    w_min: 0.2
    w_max: 5.0
    warmup_steps: 45000
  scheduler:
    enabled: true
    step_size: 40
    gamma: 0.92
  pretrain:
    enabled: true
    epochs: 3
    lr: 5.0e-5
    batch_size: 8192
    assignments_method: sample_clustering
    cluster_seed: 42
    assignments_cache_path: ../../data/cache/linkage_c_sample_assignments_6.npy
evaluation:
  batch_size: 8192
  save_predictions: true
