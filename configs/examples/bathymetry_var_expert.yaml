experiment: mesh_bathymetry_var_expert
exp_id: var-expert-bathymetry-example
experiment_root: runs
data:
  kind: node
  dataset_name: bathymetry
  split: train
  coords_path: ../../data/Mesh/Bathymetry/source_XYZT.npy
  targets:
    SALT: ../../data/Mesh/Bathymetry/target_SALT.npy
    TEMP: ../../data/Mesh/Bathymetry/target_TEMP.npy
    U: ../../data/Mesh/Bathymetry/target_U.npy
    V: ../../data/Mesh/Bathymetry/target_V.npy
model:
  name: var_expert
  in_features: 4
  num_experts: 7
  base_dim: 8
  top_k: 2
training:
  epochs: 60
  batch_size: 8192
  pred_batch_size: 8192
  num_workers: 0
  lr: 5.0e-5
  log_every: 1
  save_every: 10
  loss_type: mse
  seed: 42
  sampler: uniform_random
  pretrain:
    enabled: false
    epochs: 0
evaluation:
  batch_size: 8192
  save_predictions: true


