experiment: volume_ionization_light_basis_expert
exp_id: light_basis_expert-ionization-sub2
experiment_root: runs
data:
  kind: volume
  dataset_name: ionization
  split: train
  volume_shape:
    X: 600
    Y: 248
    Z: 248
    T: 2
  target_dir: ../../data/Volume/Ionization
model:
  name: light_basis_expert
  in_features: 4
  num_experts: 6
  base_dim: 24
  top_k: 3
  expert_num_frequencies: 6
  expert_num_layers: 3
  gate_num_layers: 3
  decoder_num_layers: 3
  head_num_layers: 2
training:
  epochs: 600
  batch_size: 16000
  pred_batch_size: 16000
  num_workers: 0
  lr: 5.0e-5
  log_every: 10
  log_psnr_every: 50
  psnr_sample_ratio: 0.1
  save_every: 50
  loss_type: mse
  seed: 42
  sampler: budgeted_random
  batches_per_epoch_budget: 1500
  multiview_ema_loss:
    enabled: true
    beta: 0.95
    eps: 1.0e-8
    w_min: 0.2
    w_max: 5.0
    warmup_steps: 45000
  scheduler:
    enabled: true
    step_size: 40
    gamma: 0.92
  pretrain:
    enabled: true
    epochs: 5
    lr: 5.0e-5
    batch_size: 16000
    assignments_method: voxel_clustering
    cluster_num_time_samples: 2
    cluster_seed: 42
    assignments_cache_path: ../../data/cache/ionization_voxel_assignments_6.npy
evaluation:
  batch_size: 16000
  save_predictions: true
