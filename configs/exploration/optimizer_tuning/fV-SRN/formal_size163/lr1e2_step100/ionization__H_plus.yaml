experiment: exploration_v5_fv_srn_formal_size163_lr1e2_step100_H_plus
exp_id: explore-v5-fv-srn-formal-size163-lr1e2-step100-H_plus
experiment_root: ${RUNS_ROOT}/exploration_v5
data:
  kind: volume
  dataset_name: ionization
  split: train
  target: H_plus
  targets:
    GT: ${IONIZATION_ROOT}/target_GT.npy
    H_plus: ${IONIZATION_ROOT}/target_H+.npy
    H2: ${IONIZATION_ROOT}/target_H2.npy
    He: ${IONIZATION_ROOT}/target_He.npy
    PD: ${IONIZATION_ROOT}/target_PD.npy
  volume_shape:
    X: 600
    Y: 248
    Z: 248
    T: 100
model:
  name: fv_srn
  grid_resolution: 6
  grid_channels: 64
  grid_init_std: 0.01
  keyframe_indices:
  - 0
  - 9
  - 18
  - 27
  - 36
  - 45
  - 54
  - 63
  - 72
  - 81
  - 90
  - 99
  fourier_features: 14
  fourier_mode: nerf
  hidden_features: 32
  hidden_layers: 3
  activation: snake_alt
  activation_frequency: 1.0
  time_encoding: none
training:
  epochs: 50
  samples_per_timestep: 240000
  validation_fraction: 0.0
  batch_size: 16000
  prediction_batch_size: 16000
  lr: 0.01
  beta_1: 0.9
  beta_2: 0.999
  lr_step: 100
  lr_gamma: 0.5
  l1_weight: 1.0
  l2_weight: 0.0
  importance_floor: 0.01
  rebuild_every: 51
  rebuild_grid_size: 32
  rebuild_samples_per_cell: 2
  save_every: 50
  log_every: 1
  seed: 42
  device: cuda
evaluation:
  batch_size: 16000
  save_predictions: false
  run_after_training: false
  default_model: compact
exploration_probe:
  enabled: true
  total_epoch_equivalents: 50
  every_epoch_equivalents: 5
  sample_ratio: 0.01
  max_samples: 100000
  seed: 42
