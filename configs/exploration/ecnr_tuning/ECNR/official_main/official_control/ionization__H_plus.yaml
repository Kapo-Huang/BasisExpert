experiment: exploration_v6_ecnr_official_main_official_control_H_plus
exp_id: explore-v6-ecnr-official-main-official-control-H_plus
experiment_root: ${RUNS_ROOT}/exploration_v6
data:
  kind: volume
  dataset_name: ionization
  split: train
  target: H_plus
  targets:
    GT: ${IONIZATION_ROOT}/target_GT.npy
    H_plus: ${IONIZATION_ROOT}/target_H+.npy
    H2: ${IONIZATION_ROOT}/target_H2.npy
    He: ${IONIZATION_ROOT}/target_He.npy
    PD: ${IONIZATION_ROOT}/target_PD.npy
  volume_shape:
    X: 600
    Y: 248
    Z: 248
    T: 100
model:
  name: ecnr
  scales: 3
  block_shape_xyz:
  - 25
  - 31
  - 31
  residual_threshold: 0.0001
  gaussian_kernel_size: 5
  gaussian_sigma: 1.0
  gaussian_padding: reflect
  latent_dim: 8
  hidden_features: 24
  hidden_layers: 3
  omega_0: 30.0
  target_blocks_per_mlp:
  - 8
  - 16
  - 32
clustering:
  distance: squared_euclidean
  input: normalized_block_values
  initialization: kmeans_pp
  seed: 42
  balancing_passes: 1
  centroid_dtype: float32
  tie_break: lowest_cluster_index
  n_init: 1
  max_iter: 300
  tol: 0.0001
  algorithm: lloyd
training:
  epochs_per_scale: 50
  batch_size: 3200
  passes_per_epoch: 1
  lr: 0.001
  beta_1: 0.9
  beta_2: 0.999
  weight_decay: 2.0e-05
  pruning_epochs:
  - 15
  - 23
  - 30
  - 38
  pruning_sparsities:
  - 0.3
  - 0.4
  - 0.45
  - 0.5
  pruning_loss_weight: 0.1
  pruning_lr_gamma: 0.75
  quantization_finetune_epochs: 8
  quantization_finetune_passes_per_epoch: 1
  quantization_finetune_lr: 1.0e-05
  save_every: 0
  log_every: 1
  progress_log_seconds: 60
  seed: 42
  device: cuda
quantization:
  mlp_weight_bits: 8
  mlp_bias_bits: 8
  latent_bits: 0
  cnn_bits: 9
  entropy: huffman
cnn:
  implementation_choice: fixed_for_underspecified_method_detail
  dimensionality: 3d
  layers: 5
  hidden_channels: 32
  kernel_size: 3
  stride: 1
  padding: 1
  dilation: 1
  bias: true
  hidden_activation: relu
  output_activation: none
  halo: 5
  tile_core_shape_zyx:
  - 32
  - 64
  - 64
  epochs: 10
  lr: 1.0e-05
evaluation:
  batch_size: 3200
  save_predictions: false
  run_after_training: true
  default_model: checkpoint
log:
  effective_config: true
  epoch_summary: true
  startup_timing: true
