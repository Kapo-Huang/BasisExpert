experiment: mesh_linkage_p_coordnet_{target}
exp_id: coordnet-linkage-p-{target}
experiment_root: runs
data:
  kind: node
  dataset_name: Linkage-P
  split: train
  coords_path: ../../data/Mesh/Linkage-P/source_point_XYZT.npy
  targets:
    point_RF: ../../data/Mesh/Linkage-P/target_point_RF.npy
    point_U: ../../data/Mesh/Linkage-P/target_point_U.npy
  target: point_RF
model:
  name: coordnet
  in_features: 4
  init_features: 6
  num_res: 9
training:
  epochs: 400
  batch_size: 16000
  pred_batch_size: 16000
  num_workers: 4
  lr: 5.0e-5
  val_split: 0.0
  log_every: 1
  log_psnr_every: 100
  psnr_sample_ratio: 0.1
  save_every: 600
  early_stop_patience: 0
  loss_type: mse
  seed: 42
  sampler: budgeted_random
  batches_per_epoch_budget: 1500
  scheduler:
    enabled: true
    step_size: 40
    gamma: 0.92
evaluation:
  batch_size: 16000
  save_predictions: true
