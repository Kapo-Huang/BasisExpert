experiment: volume_ionization_coordnet_{target}_size652
exp_id: coordnet-ionization-{target}-size652
experiment_root: runs
data:
  kind: volume
  dataset_name: ionization
  split: train
  volume_shape:
    X: 600
    Y: 248
    Z: 248
    T: 2
  targets:
    GT: ../../../data/Volume/Ionization/target_GT.npy
    H_plus: ../../../data/Volume/Ionization/target_H+.npy
    H2: ../../../data/Volume/Ionization/target_H2.npy
    He: ../../../data/Volume/Ionization/target_He.npy
    PD: ../../../data/Volume/Ionization/target_PD.npy
  target: PD
model:
  name: coordnet
  in_features: 4
  init_features: 142
  num_res: 4
training:
  epochs: 600
  batch_size: 32000
  pred_batch_size: 32000
  num_workers: 4
  lr: 1.0e-05
  val_split: 0.0
  log_every: 1
  log_psnr_every: 100
  psnr_sample_ratio: 0.1
  save_every: 600
  early_stop_patience: 0
  loss_type: mse
  seed: 42
  sampler: budgeted_random
  batches_per_epoch_budget: 1500
evaluation:
  batch_size: 32000
  save_predictions: true
