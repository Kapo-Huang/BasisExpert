experiment: mesh_car_moe_inr_{target}
exp_id: moeinr-car-{target}
experiment_root: runs
data:
  kind: node
  dataset_name: car
  split: train
  coords_path: ../../data/Mesh/Car/source_XYZT.npy
  targets:
    CoefPressure: ../../data/Mesh/Car/target_CoefPressure.npy
    dp-dX: ../../data/Mesh/Car/target_dp-dX.npy
    dp-dY: ../../data/Mesh/Car/target_dp-dY.npy
    dp-dZ: ../../data/Mesh/Car/target_dp-dZ.npy
    EnergyInternal: ../../data/Mesh/Car/target_EnergyInternal.npy
    Enthalpy: ../../data/Mesh/Car/target_Enthalpy.npy
    EnthalpyStagnation: ../../data/Mesh/Car/target_EnthalpyStagnation.npy
    Lambda_2_Criterion: ../../data/Mesh/Car/target_Lambda_2_Criterion.npy
    Pressure: ../../data/Mesh/Car/target_Pressure.npy
    PressureDynamic: ../../data/Mesh/Car/target_PressureDynamic.npy
    Production_of_k: ../../data/Mesh/Car/target_Production_of_k.npy
    Q_Criterion_Raw: ../../data/Mesh/Car/target_Q_Criterion_Raw.npy
    Skin_Friction_Coefficient: ../../data/Mesh/Car/target_Skin_Friction_Coefficient.npy
    SkinFrictionMagnitude: ../../data/Mesh/Car/target_SkinFrictionMagnitude.npy
    SkinFrictionX: ../../data/Mesh/Car/target_SkinFrictionX.npy
    SkinFrictionY: ../../data/Mesh/Car/target_SkinFrictionY.npy
    SkinFrictionZ: ../../data/Mesh/Car/target_SkinFrictionZ.npy
    Strain_Rate: ../../data/Mesh/Car/target_Strain_Rate.npy
    Turbulent_Intensity: ../../data/Mesh/Car/target_Turbulent_Intensity.npy
    Turbulent_Viscosity_Ratio: ../../data/Mesh/Car/target_Turbulent_Viscosity_Ratio.npy
    TurbulentDissipation: ../../data/Mesh/Car/target_TurbulentDissipation.npy
    TurbulentEnergyKinetic: ../../data/Mesh/Car/target_TurbulentEnergyKinetic.npy
    ViscosityEddy: ../../data/Mesh/Car/target_ViscosityEddy.npy
    VorticityMagnitude: ../../data/Mesh/Car/target_VorticityMagnitude.npy
    VorticityX: ../../data/Mesh/Car/target_VorticityX.npy
    VorticityY: ../../data/Mesh/Car/target_VorticityY.npy
    VorticityZ: ../../data/Mesh/Car/target_VorticityZ.npy
    Wall_Yplus: ../../data/Mesh/Car/target_Wall_Yplus.npy
  target: CoefPressure
model:
  name: moe_inr
  in_features: 4
  num_experts: 7
  base_dim: 14
  encoder_first_omega_0: 30.0
  encoder_hidden_omega_0: 30.0
  policy_num_layers: 3
  policy_first_omega_0: 30.0
  policy_hidden_omega_0: 30.0
training:
  epochs: 600
  batch_size: 16000
  pred_batch_size: 16000
  num_workers: 4
  lr: 5.0e-5
  val_split: 0.0
  log_every: 1
  log_psnr_every: 100
  psnr_sample_ratio: 0.1
  save_every: 600
  early_stop_patience: 0
  loss_type: mse
  seed: 42
  sampler: budgeted_random
  batches_per_epoch_budget: 1500
  scheduler:
    enabled: true
    step_size: 40
    gamma: 0.92
  pretrain:
    enabled: true
    epochs: 0
    lr: 5.0e-5
    batch_size: 16000
    assignments_method: sample_clustering
    cluster_num_time_samples: 7
    cluster_seed: 42
    assignments_cache_path: ../../data/cache/car_sample_assignments_7.npy
evaluation:
  batch_size: 16000
  save_predictions: true
