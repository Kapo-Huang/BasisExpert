experiment: bathymetry_moe-inr_U
exp_id: moe-inr-bathymetry-U
experiment_root: ${REPO_ROOT}/runs
data:
  kind: node
  dataset_name: bathymetry
  split: train
  coords_path: ${REPO_ROOT}/data/Mesh/Bathymetry/source_XYZT.npy
  targets:
    SALT: ${REPO_ROOT}/data/Mesh/Bathymetry/target_SALT.npy
    TEMP: ${REPO_ROOT}/data/Mesh/Bathymetry/target_TEMP.npy
    U: ${REPO_ROOT}/data/Mesh/Bathymetry/target_U.npy
    V: ${REPO_ROOT}/data/Mesh/Bathymetry/target_V.npy
  target: U
model:
  name: moe_inr
  in_features: 4
  num_experts: 7
  base_dim: 14
  policy_num_layers: 3
training:
  epochs: 600
  batch_size: 16000
  pred_batch_size: 16000
  num_workers: 0
  lr: 5.0e-05
  val_split: 0.0
  log_every: 10
  log_psnr_every: 100
  psnr_sample_ratio: 0.1
  save_every: 600
  early_stop_patience: 0
  loss_type: mse
  seed: 42
  sampler: budgeted_random
  batches_per_epoch_budget: 1500
  scheduler:
    enabled: true
    step_size: 40
    gamma: 0.92
evaluation:
  batch_size: 16000
  save_predictions: false
log:
  timing:
    enabled: true
    epoch_breakdown: true
    step_window: false
    step_window_every_steps: 100
    cuda_sync: false
