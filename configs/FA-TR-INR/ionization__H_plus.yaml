experiment: ionization_fa-tr-inr_H_plus
exp_id: fa-tr-inr-ionization-H_plus
experiment_root: ${REPO_ROOT}/runs
data:
  kind: volume
  dataset_name: ionization
  split: train
  volume_shape:
    X: 600
    Y: 248
    Z: 248
    T: 100
  targets:
    GT: ${REPO_ROOT}/data/Volume/Ionization/target_GT.npy
    H_plus: ${REPO_ROOT}/data/Volume/Ionization/target_H+.npy
    H2: ${REPO_ROOT}/data/Volume/Ionization/target_H2.npy
    He: ${REPO_ROOT}/data/Volume/Ionization/target_He.npy
    PD: ${REPO_ROOT}/data/Volume/Ionization/target_PD.npy
  target: H_plus
model:
  name: fa_tr_inr
  in_features: 4
  out_features: 1
  frequency_coordinates:
  - 1.0
  - 2.0
  - 3.0
  omega: 19.0
  factor_mlp_depth: 4
  factor_hidden_width: 128
  integration_mlp_depth: 2
  tensor_ring_ranks:
  - 22
  - 88
  - 3
  - 3
  - 5
training:
  epochs: 600
  batch_size: 16000
  pred_batch_size: 16000
  num_workers: 0
  lr: 0.0001
  val_split: 0.0
  log_every: 10
  log_psnr_every: 100
  psnr_sample_ratio: 0.1
  save_every: 600
  early_stop_patience: 0
  loss_type: mse
  seed: 42
  sampler: budgeted_random
  batches_per_epoch_budget: 1500
  scheduler:
    enabled: false
    step_size: 0
    gamma: 1.0
  beta_1: 0.9
  beta_2: 0.999
  epsilon: 1.0e-08
  weight_decay: 0.0
evaluation:
  batch_size: 16000
  save_predictions: false
log:
  timing:
    enabled: true
    epoch_breakdown: true
    step_window: false
    step_window_every_steps: 100
    cuda_sync: false
