experiment: redsea_coordnet_V
exp_id: coordnet-redsea-V
experiment_root: ${REPO_ROOT}/runs
data:
  kind: node
  dataset_name: redsea
  split: train
  coords_path: ${REDSEA_ROOT}/source_XYZT.npy
  targets:
    SALT: ${REDSEA_ROOT}/target_SALT.npy
    TEMP: ${REDSEA_ROOT}/target_TEMP.npy
    U: ${REDSEA_ROOT}/target_U.npy
    V: ${REDSEA_ROOT}/target_V.npy
  target: V
model:
  name: coordnet
  in_features: 4
  init_features: 7
  num_res: 8
training:
  epochs: 600
  batch_size: 16000
  pred_batch_size: 16000
  num_workers: 0
  lr: 1.0e-05
  val_split: 0.0
  log_every: 10
  log_psnr_every: 100
  psnr_sample_ratio: 0.1
  save_every: 600
  early_stop_patience: 0
  loss_type: mse
  seed: 42
  sampler: budgeted_random
  batches_per_epoch_budget: 1500
  scheduler:
    enabled: true
    step_size: 40
    gamma: 0.92
evaluation:
  batch_size: 16000
  save_predictions: false
log:
  timing:
    enabled: true
    epoch_breakdown: true
    step_window: false
    step_window_every_steps: 100
    cuda_sync: false
