experiment: redsea_mc_inr
exp_id: mc-inr-redsea
experiment_root: ${RUNS_ROOT}
data:
  kind: node
  dataset_name: redsea
  split: train
  coords_path: ${REDSEA_ROOT}/source_XYZT.npy
  targets:
    SALT: ${REDSEA_ROOT}/target_SALT.npy
    TEMP: ${REDSEA_ROOT}/target_TEMP.npy
    U: ${REDSEA_ROOT}/target_U.npy
    V: ${REDSEA_ROOT}/target_V.npy
model:
  name: mc_inr
  hidden_features: 96
  gfe_layers: 5
  lfe_layers: 6
training:
  epochs: 60
  batch_size: 16000
  pred_batch_size: 16000
  num_workers: 0
  lr: 5.0e-05
  weight_decay: 0.0
  loss_type: mse
  log_every: 10
  save_every: 0
  seed: 42
  device: cuda
  initial_k: 12
  cluster_init_method: coord_kmeans
  assignments_cache_path: ${REPO_ROOT}/data/cache/mc_inr/redsea_assignments_k12.npy
  meta_iterations: 60
  meta_inner_steps: 5
  meta_inner_batch_size: 16000
  meta_inner_lr: 0.0001
  meta_batch_clusters: 4
  meta_support_max_rows: 32000
  meta_outer_lr: 0.001
  convergence_patience: 0
  convergence_delta: 0.0
  finetune_epochs: 600
  batches_per_epoch_budget: 1500
  finetune_lr: 5.0e-05
  finetune_sampling_ratio: 1.0
  recluster_after_finetune: false
  split_threshold: 0.0005
  min_split_points: 32
  max_recluster_rounds: 0
  cluster_aware_batches: false
  scheduler:
    enabled: true
    step_size: 40
    gamma: 0.92
evaluation:
  batch_size: 16000
  save_predictions: false
log:
  timing:
    enabled: true
    epoch_breakdown: true
    step_window: false
    step_window_every_steps: 100
    cuda_sync: false
