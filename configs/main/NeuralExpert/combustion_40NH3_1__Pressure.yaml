seed: 0
wandb_project: inr_moe_combustion_40NH3_1
experiment: neural_expert_combustion_40NH3_1_Pressure
exp_id: neural-expert-combustion_40NH3_1-Pressure
experiment_root: ${REPO_ROOT}/runs/neural_expert
MODEL:
  model_name: inr_moe_ionization
  in_dim: 4
  out_dim: 1
  decoder_hidden_dim: 64
  decoder_n_hidden_layers: 2
  decoder_input_encoding: learned_512_2_sine_siren_none
  decoder_nl: sine
  decoder_init_type: siren
  n_experts: 8
  outermost_linear: true
  input_encoding: none
  decoder_freqs: 30.0
  decoder_trainable_freqs: false
  top_k: 1
  manager_hidden_dim: 128
  manager_n_hidden_layers: 2
  manager_input_encoding: learned_128_2_sine_siren_none
  manager_nl: sine
  manager_init: siren
  manager_type: standard
  experts_bias_std: 0.1
  experts_bias_weight: 1.0
  manager_softmax_temperature: 1.0
  manager_softmax_temp_trainable: false
  manager_q_activation: softmax
  manager_clamp_q: 0.0
  manager_conditioning: cat
  manager_pt_path: ${REPO_ROOT}/runs/neural_expert/pretrained_managers/combustion_40NH3_1/default/pt_inr_moe_ionization_Pressure_managerpretraining.pth
  load_pt_manager: true
  shared_encoder: false
LOSS:
  scale_by_q_grad: false
  loss_type: 1000valrecon
  segmentation_type: both
  sample_bias_correction: false
  entropy_metric: kl
DATA:
  dataset_name: combustion_40NH3_1
  target: Pressure
  targets:
    Absolute_Pressure: ${COMBUSTION_ROOT}/target_Absolute_Pressure.npy
    Chemistry_Heat_Release_Rate: ${COMBUSTION_ROOT}/target_Chemistry_Heat_Release_Rate.npy
    Mole_Fraction_of_CH4: ${COMBUSTION_ROOT}/target_Mole_Fraction_of_CH4.npy
    Mole_Fraction_of_CO: ${COMBUSTION_ROOT}/target_Mole_Fraction_of_CO.npy
    Mole_Fraction_of_CO2: ${COMBUSTION_ROOT}/target_Mole_Fraction_of_CO2.npy
    Mole_Fraction_of_H2O: ${COMBUSTION_ROOT}/target_Mole_Fraction_of_H2O.npy
    Mole_Fraction_of_NH2: ${COMBUSTION_ROOT}/target_Mole_Fraction_of_NH2.npy
    Mole_Fraction_of_NH3: ${COMBUSTION_ROOT}/target_Mole_Fraction_of_NH3.npy
    Mole_Fraction_of_OH: ${COMBUSTION_ROOT}/target_Mole_Fraction_of_OH.npy
    Pressure: ${COMBUSTION_ROOT}/target_Pressure.npy
    Temperature: ${COMBUSTION_ROOT}/target_Temperature.npy
    Velocity: ${COMBUSTION_ROOT}/target_Velocity.npy
    Velocity_Magnitude: ${COMBUSTION_ROOT}/target_Velocity_Magnitude.npy
  target_stats_path: ${REPO_ROOT}/data/cache/neural_expert/combustion_40NH3_1/target_stats_Pressure.npz
  normalize_inputs: true
  normalize_targets: false
  volume_shape:
    X: 128
    Y: 128
    Z: 1
    T: 2001
  segmentation_type: random_balanced
  grid_patch_size: 4
  n_segments: 8
TRAINING:
  n_points: 16000
  lr: 3.0e-05
  lr_gamma: 0.9999
  lr_scheduler: ExponentialLR
  num_epochs: 60000
  batch_size: 1
  num_workers: 0
  grad_clip_norm: 10.0
  save_every: 500
  segmentation_mode: false
  log_every: 100
  stages:
  - end_iteration_frac: 1.0
    params: all
    loss_type: 1000valrecon
