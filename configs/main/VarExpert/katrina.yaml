experiment: katrina_var_expert
exp_id: var-expert-katrina
experiment_root: ${RUNS_ROOT}
data:
  kind: node
  dataset_name: katrina
  split: train
  coords_path: ${KATRINA_ROOT}/source_XYZT.npy
  targets:
    fort63: ${KATRINA_ROOT}/target_fort63.npy
    fort64: ${KATRINA_ROOT}/target_fort64.npy
    fort73: ${KATRINA_ROOT}/target_fort73.npy
    speed: ${KATRINA_ROOT}/target_speed.npy
    v: ${KATRINA_ROOT}/target_v.npy
model:
  name: var_expert
  in_features: 4
  num_experts: 6
  base_dim: 8
  top_k: 3
training:
  epochs: 600
  batch_size: 16000
  pred_batch_size: 16000
  num_workers: 0
  lr: 5.0e-05
  val_split: 0.0
  log_every: 10
  log_psnr_every: 100
  psnr_sample_ratio: 0.1
  save_every: 0
  early_stop_patience: 0
  loss_type: mse
  seed: 42
  sampler: budgeted_random
  batches_per_epoch_budget: 1500
  scheduler:
    enabled: true
    step_size: 40
    gamma: 0.92
  multiview_ema_loss:
    enabled: true
    beta: 0.95
    eps: 1.0e-08
    w_min: 0.2
    w_max: 5.0
    warmup_steps: 45000
    alpha: 5.0
  pretrain:
    enabled: false
    epochs: 0
    lr: 5.0e-05
evaluation:
  batch_size: 16000
  save_predictions: false
log:
  timing:
    enabled: true
    epoch_breakdown: true
    step_window: false
    step_window_every_steps: 100
    cuda_sync: false
