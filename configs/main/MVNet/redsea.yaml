experiment: redsea_mvnet
exp_id: mvnet-redsea
experiment_root: ${RUNS_ROOT}
data:
  kind: node
  dataset_name: redsea
  split: train
  coords_path: ${REDSEA_ROOT}/source_XYZT.npy
  targets:
    SALT: ${REDSEA_ROOT}/target_SALT.npy
    TEMP: ${REDSEA_ROOT}/target_TEMP.npy
    U: ${REDSEA_ROOT}/target_U.npy
    V: ${REDSEA_ROOT}/target_V.npy
model:
  name: mvnet
  in_features: 4
  out_features: 4
  hidden_features: 73
  num_residual_blocks: 10
  omega_0: 30.0
  bias: true
training:
  epochs: 300
  batch_size: 2048
  pred_batch_size: 16000
  gradient_accumulation_steps: 1
  num_workers: 0
  lr: 1.0e-05
  beta_1: 0.9
  beta_2: 0.999
  epsilon: 1.0e-08
  weight_decay: 0.0
  val_split: 0.0
  log_every: 10
  log_psnr_every: 0
  psnr_sample_ratio: 0.1
  save_every: 0
  early_stop_patience: 0
  loss_type: mse
  seed: 42
  sampler: budgeted_random
  batches_per_epoch_budget: 1500
  scheduler:
    enabled: true
    interval: epoch
    step_size: 40
    gamma: 0.92
  pretrain:
    enabled: false
evaluation:
  batch_size: 16000
  save_predictions: false
log:
  timing:
    enabled: true
    epoch_breakdown: true
    step_window: false
    step_window_every_steps: 100
    cuda_sync: false
