experiment: volume_ionization_var_expert_size1304
exp_id: var-expert-ionization-size1304
experiment_root: runs
data:
  kind: volume
  dataset_name: ionization
  split: train
  volume_shape:
    X: 600
    Y: 248
    Z: 248
    T: 2
  targets:
    GT: ../../../data/Volume/Ionization/target_GT.npy
    H_plus: ../../../data/Volume/Ionization/target_H+.npy
    H2: ../../../data/Volume/Ionization/target_H2.npy
    He: ../../../data/Volume/Ionization/target_He.npy
    PD: ../../../data/Volume/Ionization/target_PD.npy
model:
  name: var_expert
  in_features: 4
  num_experts: 6
  base_dim: 70
  top_k: 3
training:
  epochs: 600
  batch_size: 16000
  pred_batch_size: 16000
  num_workers: 0
  lr: 5.0e-05
  val_split: 0.0
  log_every: 10
  log_psnr_every: 50
  psnr_sample_ratio: 0.1
  save_every: 50
  early_stop_patience: 0
  loss_type: mse
  seed: 42
  sampler: budgeted_random
  batches_per_epoch_budget: 1500
  multiview_ema_loss:
    enabled: false
    beta: 0.95
    eps: 1.0e-08
    w_min: 0.2
    w_max: 5.0
    warmup_steps: 45000
  scheduler:
    enabled: true
    step_size: 40
    gamma: 0.92
  pretrain:
    enabled: true
    epochs: 0
    lr: 5.0e-05
    cluster_seed: 42
    assignments_cache_path: data/cache/ionization_voxel_assignments_6.npy
evaluation:
  batch_size: 16000
  save_predictions: true
log:
  effective_config: true
  model_stats: true
  epoch_summary: true
  startup_timing: true
  psnr:
    enabled: true
    per_target: true
  timing:
    enabled: true
    epoch_breakdown: true
    step_window: true
    step_window_every_steps: 100
    cuda_sync: false
