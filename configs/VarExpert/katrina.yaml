experiment: mesh_katrina_var_expert
exp_id: var-expert-katrina
experiment_root: runs
data:
  kind: node
  dataset_name: katrina
  split: train
  coords_path: ../../data/Mesh/Katrina/source_XYZT.npy
  targets:
    fort63: ../../data/Mesh/Katrina/target_fort63.npy
    fort64: ../../data/Mesh/Katrina/target_fort64.npy
    fort73: ../../data/Mesh/Katrina/target_fort73.npy
    speed: ../../data/Mesh/Katrina/target_speed.npy
    v: ../../data/Mesh/Katrina/target_v.npy
model:
  name: var_expert
  in_features: 4
  num_experts: 6
  base_dim: 8
  top_k: 3
training:
  epochs: 600
  batch_size: 16000
  pred_batch_size: 16000
  num_workers: 0
  lr: 5.0e-5
  val_split: 0.0
  log_every: 10
  log_psnr_every: 10
  psnr_sample_ratio: 0.1
  save_every: 600
  early_stop_patience: 0
  loss_type: mse
  seed: 42
  sampler: budgeted_random
  batches_per_epoch_budget: 1500
  multiview_ema_loss:
    enabled: true
    beta: 0.95
    eps: 1.0e-8
    w_min: 0.2
    w_max: 5.0
    warmup_steps: 45000
  scheduler:
    enabled: true
    step_size: 40
    gamma: 0.92
  pretrain:
    enabled: false
    epochs: 0
evaluation:
  batch_size: 16000
  save_predictions: true
log:
  effective_config: true
  model_stats: true
  epoch_summary: true
  startup_timing: true
  psnr:
    enabled: true
    per_target: true
  timing:
    enabled: true
    epoch_breakdown: true
    step_window: true
    step_window_every_steps: 100
    cuda_sync: false

