experiment: mesh_linkage_p_var_expert
exp_id: var-expert-linkage-p
experiment_root: runs
data:
  kind: node
  dataset_name: Linkage-P
  split: train
  coords_path: ../../data/Mesh/Linkage-P/source_point_XYZT.npy
  targets:
    point_RF: ../../data/Mesh/Linkage-P/target_point_RF.npy
    point_U: ../../data/Mesh/Linkage-P/target_point_U.npy
model:
  name: var_expert
  in_features: 4
  num_experts: 6
  base_dim: 4
  top_k: 3
training:
  epochs: 600
  batch_size: 16000
  pred_batch_size: 16000
  num_workers: 0
  lr: 5.0e-5
  val_split: 0.0
  log_every: 10
  log_psnr_every: 10
  psnr_sample_ratio: 0.1
  save_every: 300
  early_stop_patience: 0
  loss_type: mse
  seed: 42
  sampler: budgeted_random
  batches_per_epoch_budget: 1500
  multiview_ema_loss:
    enabled: true
    beta: 0.95
    eps: 1.0e-8
    w_min: 0.2
    w_max: 5.0
    warmup_steps: 45000
  scheduler:
    enabled: true
    step_size: 40
    gamma: 0.92
  pretrain:
    enabled: false
    epochs: 0
evaluation:
  batch_size: 16000
  save_predictions: true

