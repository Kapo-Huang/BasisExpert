# Evaluate metrics for every archived Result run over every timestep without
# generating reconstruction images.
run_root: Result/RD Curve
result_root: EvalResult
evaluation_id: result_full
continue_on_error: true
item_timeout_seconds: 86400

evaluation:
  metrics:
    - psnr
    - ssim
    - lpips
  timesteps: all
  targets_by_dataset: null
  render: true
  incremental: true
  source: checkpoint
  overwrite: false
  device: null
  render_profile: auto
