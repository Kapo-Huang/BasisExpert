# Recompute the standard quality metrics for every archived Katrina run.
# SSIM and LPIPS require rendered frames internally, so those artifacts are
# retained and can be reused by the render-only entry point below.
manifest_path: Result/MANIFEST.tsv
manifest_selection:
  datasets:
    - Katrina
result_root: EvalResult
evaluation_id: katrina_recompute
continue_on_error: true
item_timeout_seconds: 86400

evaluation:
  metrics:
    - psnr
    - ssim
    - lpips
  timesteps: uniform:16
  targets_by_dataset: null
  render: false
  incremental: true
  source: checkpoint
  overwrite: false
  device: null
  render_profile: auto
