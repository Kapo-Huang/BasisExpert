# Estimate end-to-end training and inference time for each logical Result group.
# Joint runs are evaluated directly. Per-target methods evaluate one canonical
# target and multiply its time by the full dataset variable count.
run_root: Result
result_root: EvalResult
evaluation_id: result_runtime_dataset_total_v2
continue_on_error: true
item_timeout_seconds: 86400

runtime_aggregation:
  mode: dataset_total
  datasets:
    Ionization:
      representative_target: GT
      variable_count: 5
    Combustion:
      representative_target: Absolute_Pressure
      variable_count: 13
    Katrina:
      representative_target: fort63
      variable_count: 5
    RedSea:
      representative_target: SALT
      variable_count: 4

evaluation:
  metrics:
    - training_time
    - inference_time
  timesteps: all
  targets_by_dataset: null
  render: false
  incremental: true
  source: checkpoint
  overwrite: false
  device: null
  training_probe_samples: 72000000
  training_total_samples: 14400000000
  inference_fraction: 0.1
