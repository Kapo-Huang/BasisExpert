# Evaluate archived Main and RD Curve runs with the standard quality metrics
# and fixed-range point-wise error analysis. Error percentages use the
# normalized ground-truth range [-1, 1], so error = abs_error / 2 * 100.
run_roots:
  - Result/RD Curve/MINER
result_root: EvalResult
evaluation_id: result_error
continue_on_error: true
item_timeout_seconds: 3600

evaluation:
  metrics:
    - error
  error_vmin: 0.0
  error_vmax: 5.0
  timesteps: uniform:10
  targets_by_dataset: null
  render: true
  incremental: true
  source: checkpoint
  overwrite: false
  device: null
  render_profile: auto
