# Evaluate archived Katrina runs from the Main experiment group with
# fixed-range point-wise error analysis. Error percentages use the normalized
# ground-truth range [-1, 1], so error = abs_error / 2 * 100.
run_roots:
  - Result/Main/Ours/Katrina
  - Result/Main/CoordNet/Katrina
  - Result/Main/SIREN/Katrina
  - Result/Main/Neural Experts/Katrina
  - Result/Main/MoE-INR/Katrina
  - Result/Main/STSR-INR/Katrina
  - Result/Main/MVNet/Katrina
result_root: EvalResult
evaluation_id: result_error
continue_on_error: true
item_timeout_seconds: 3600

evaluation:
  metrics:
    - error
  error_vmin: 0.0
  error_vmax: 5.0
  timesteps: uniform:16
  targets_by_dataset: null
  render: true
  incremental: true
  source: checkpoint
  overwrite: false
  device: null
  render_profile: auto
