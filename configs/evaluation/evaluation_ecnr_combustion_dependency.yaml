# Cross-variable dependency metrics for the complete archived ECNR Combustion
# group.  These are intentionally separate from per-target quality metrics.
run_roots:
  - Result/Main/ECNR/Combustion
result_root: EvalResult
evaluation_id: ecnr_combustion_dependency
continue_on_error: true
item_timeout_seconds: 86400
cache_root: EvalResult/artifacts/dependency_gt

settings:
  sample_ratio: 0.2
  seed: 42
  max_bins: 64
  variance_eps: 1.0e-12

datasets:
  combustion_40NH3_1:
    config: configs/main/VarExpert/combustion_40NH3_1.yaml
    targets:
      - Absolute_Pressure
      - Chemistry_Heat_Release_Rate
      - Mole_Fraction_of_CH4
      - Mole_Fraction_of_CO
      - Mole_Fraction_of_CO2
      - Mole_Fraction_of_H2O
      - Mole_Fraction_of_NH2
      - Mole_Fraction_of_NH3
      - Mole_Fraction_of_OH
      - Pressure
      - Temperature
      - Velocity_Magnitude

evaluation:
  metrics: [pearson_error, mi_error]
  timesteps: uniform:30
  source: checkpoint
  overwrite: false
  device: null
