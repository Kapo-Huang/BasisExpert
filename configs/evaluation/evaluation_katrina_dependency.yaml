# Recompute only Katrina cross-variable dependency metrics. This keeps the
# global dependency batch from scheduling missing MINER/ECNR groups.
run_roots:
  - Result/Main/Ours/Katrina
  - Result/Main/CoordNet/Katrina
  - Result/Main/SIREN/Katrina
  - Result/Main/Neural Experts/Katrina
  - Result/Main/MoE-INR/Katrina
  - Result/Main/MVNet/Katrina
  - Result/Main/STSR-INR/Katrina
result_root: EvalResult
evaluation_id: result_dependency
continue_on_error: true
item_timeout_seconds: 86400
cache_root: EvalResult/artifacts/dependency_gt

settings:
  sample_ratio: 0.2
  seed: 42
  max_bins: 64
  variance_eps: 1.0e-12

datasets:
  katrina:
    config: configs/main/VarExpert/katrina.yaml
    targets: [fort63, fort64, fort73, speed]

evaluation:
  metrics: [pearson_error, mi_error]
  timesteps: uniform:30
  source: checkpoint
  overwrite: false
  device: null
