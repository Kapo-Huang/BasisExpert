experiment: mesh_car_mc_inr
exp_id: mc-inr-car
experiment_root: runs
data:
  kind: node
  dataset_name: car
  split: train
  coords_path: ../../data/Mesh/Car/source_XYZT.npy
  targets:
    CoefPressure: ../../data/Mesh/Car/target_CoefPressure.npy
    Pressure: ../../data/Mesh/Car/target_Pressure.npy
    VorticityMagnitude: ../../data/Mesh/Car/target_VorticityMagnitude.npy
model:
  name: mc_inr
  hidden_features: 96
  gfe_layers: 5
  lfe_layers: 6
training:
  epochs: 60
  batch_size: 16000
  pred_batch_size: 16000
  num_workers: 0
  lr: 5.0e-5
  weight_decay: 0.0
  loss_type: mse
  log_every: 5
  save_every: 10
  seed: 42
  device: cuda
  initial_k: 12
  cluster_init_method: coord_kmeans
  assignments_cache_path: ../../data/cache/mc_inr/car_coord_assignments_k12.npy
  meta_sampling_ratio: 0.3
  convergence_patience: 20
  convergence_delta: 0.0
  finetune_epochs: 120
  finetune_lr: 5.0e-5
  finetune_sampling_ratio: 1.0
  scheduler:
    enabled: true
    step_size: 30
    gamma: 0.92
evaluation:
  batch_size: 16000
  save_predictions: true
log:
  effective_config: true
  model_stats: true
  epoch_summary: true
  startup_timing: true
  psnr:
    enabled: true
    per_target: true
  timing:
    enabled: false
    epoch_breakdown: false
    step_window: false
    step_window_every_steps: 100
    cuda_sync: false
