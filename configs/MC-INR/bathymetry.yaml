experiment: mesh_bathymetry_mc_inr
exp_id: mc-inr-bathymetry
experiment_root: runs
data:
  kind: node
  dataset_name: bathymetry
  split: train
  coords_path: ../../data/Mesh/Bathymetry/source_XYZT.npy
  targets:
    SALT: ../../data/Mesh/Bathymetry/target_SALT.npy
    TEMP: ../../data/Mesh/Bathymetry/target_TEMP.npy
    U: ../../data/Mesh/Bathymetry/target_U.npy
    V: ../../data/Mesh/Bathymetry/target_V.npy
model:
  name: mc_inr
  hidden_features: 96
  gfe_layers: 5
  lfe_layers: 6
training:
  epochs: 60
  batch_size: 16000
  pred_batch_size: 16000
  num_workers: 0
  lr: 5.0e-5
  weight_decay: 0.0
  loss_type: mse
  log_every: 5
  save_every: 10
  seed: 42
  device: cuda
  initial_k: 12
  cluster_init_method: coord_kmeans
  assignments_cache_path: ../../data/cache/mc_inr/bathymetry_coord_assignments_k12.npy
  meta_iterations: 60
  meta_inner_steps: 5
  meta_inner_batch_size: 8192
  meta_inner_lr: 1.0e-4
  meta_batch_clusters: 4
  meta_support_max_rows: 32768
  meta_outer_lr: 1.0e-3
  convergence_patience: 20
  convergence_delta: 0.0
  finetune_epochs: 120
  finetune_lr: 5.0e-5
  finetune_sampling_ratio: 1.0
  recluster_after_finetune: false
  split_threshold: 5.0e-4
  min_split_points: 32
  max_recluster_rounds: 3
  cluster_aware_batches: true
  scheduler:
    enabled: true
    step_size: 30
    gamma: 0.92
evaluation:
  batch_size: 16000
  save_predictions: true
log:
  effective_config: true
  model_stats: true
  epoch_summary: true
  startup_timing: true
  psnr:
    enabled: true
    per_target: true
  timing:
    enabled: false
    epoch_breakdown: false
    step_window: false
    step_window_every_steps: 100
    cuda_sync: false
