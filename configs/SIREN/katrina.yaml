experiment: mesh_katrina_siren_{target}
exp_id: siren-katrina-{target}
experiment_root: runs
data:
  kind: node
  dataset_name: katrina
  split: train
  coords_path: ../../data/Mesh/Katrina/source_XYZT.npy
  targets:
    fort63: ../../data/Mesh/Katrina/target_fort63.npy
    fort64: ../../data/Mesh/Katrina/target_fort64.npy
    fort73: ../../data/Mesh/Katrina/target_fort73.npy
    speed: ../../data/Mesh/Katrina/target_speed.npy
    v: ../../data/Mesh/Katrina/target_v.npy
  target: speed
model:
  name: siren
  in_features: 4
  hidden_features: 56
  hidden_layers: 5
  first_omega_0: 30.0
  hidden_omega_0: 30.0
training:
  epochs: 600
  batch_size: 16000
  pred_batch_size: 16000
  num_workers: 4
  lr: 5.0e-5
  val_split: 0.0
  log_every: 1
  log_psnr_every: 100
  psnr_sample_ratio: 0.1
  save_every: 600
  early_stop_patience: 0
  loss_type: mse
  seed: 42
  sampler: budgeted_random
  batches_per_epoch_budget: 1500
  scheduler:
    enabled: true
    step_size: 40
    gamma: 0.92
evaluation:
  batch_size: 16000
  save_predictions: true
