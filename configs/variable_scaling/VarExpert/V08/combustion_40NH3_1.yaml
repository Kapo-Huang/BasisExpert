experiment: combustion_40NH3_1_var_expert_variable_scaling_v08
exp_id: var-expert-combustion-40NH3-1-variable-scaling-v08
experiment_root: ${REPO_ROOT}/runs/variable_scaling
data:
  kind: volume
  dataset_name: combustion_40NH3_1
  split: train
  volume_shape:
    X: 128
    Y: 128
    Z: 1
    T: 2001
  targets:
    Chemistry_Heat_Release_Rate: ${COMBUSTION_ROOT}/target_Chemistry_Heat_Release_Rate.npy
    Mole_Fraction_of_CO: ${COMBUSTION_ROOT}/target_Mole_Fraction_of_CO.npy
    Mole_Fraction_of_H2O: ${COMBUSTION_ROOT}/target_Mole_Fraction_of_H2O.npy
    Mole_Fraction_of_NH2: ${COMBUSTION_ROOT}/target_Mole_Fraction_of_NH2.npy
    Mole_Fraction_of_OH: ${COMBUSTION_ROOT}/target_Mole_Fraction_of_OH.npy
    Pressure: ${COMBUSTION_ROOT}/target_Pressure.npy
    Temperature: ${COMBUSTION_ROOT}/target_Temperature.npy
    Velocity: ${COMBUSTION_ROOT}/target_Velocity.npy
  coordinate_axes:
  - x
  - y
  - t
model:
  name: var_expert
  in_features: 3
  num_experts: 6
  base_dim: 24
  top_k: 3
training:
  epochs: 600
  batch_size: 16000
  pred_batch_size: 16000
  num_workers: 0
  lr: 5.0e-05
  val_split: 0.0
  log_every: 10
  log_psnr_every: 100
  psnr_sample_ratio: 0.1
  save_every: 600
  early_stop_patience: 0
  loss_type: mse
  seed: 42
  sampler: budgeted_random
  batches_per_epoch_budget: 1500
  scheduler:
    enabled: true
    step_size: 40
    gamma: 0.92
  multiview_ema_loss:
    enabled: true
    beta: 0.95
    eps: 1.0e-08
    w_min: 0.2
    w_max: 5.0
    warmup_steps: 45000
    alpha: 5.0
  pretrain:
    enabled: true
    epochs: 5
    lr: 5.0e-05
    cluster_seed: 42
    assignments_cache_path: ${REPO_ROOT}/data/cache/combustion_40NH3_1_voxel_assignments_6.npy
evaluation:
  batch_size: 16000
  save_predictions: false
log:
  timing:
    enabled: true
    epoch_breakdown: true
    step_window: false
    step_window_every_steps: 100
    cuda_sync: false
