experiment: redsea_stsr_inr
exp_id: stsr-inr-redsea
experiment_root: ${REPO_ROOT}/runs
data:
  kind: node
  dataset_name: redsea
  split: train
  coords_path: ${DATASETS_ROOT}/Ocean/train/source_XYZT.npy
  coordinate_stats_path: ${DATASETS_ROOT}/Ocean/train/target_stats_multi_normalized.npz
  targets:
    fort63: ${DATASETS_ROOT}/Ocean/train/target_fort63_normalized.npy
    fort64: ${DATASETS_ROOT}/Ocean/train/target_fort64_normalized.npy
    fort73: ${DATASETS_ROOT}/Ocean/train/target_fort73_normalized.npy
    speed: ${DATASETS_ROOT}/Ocean/train/target_speed_normalized.npy
    v: ${DATASETS_ROOT}/Ocean/train/target_v_normalized.npy
model:
  name: stsr_inr
  in_features: 4
  init_features: 64
  num_res: 5
  omega_0: 5.0
  embedding_dims: 256
  outermost_linear: true
  use_global_latent: true
training:
  epochs: 60
  batch_size: 8192
  pred_batch_size: 8192
  num_workers: 0
  lr: 5.0e-05
  val_split: 0.0
  log_every: 1
  log_psnr_every: 10
  psnr_sample_ratio: 0.1
  save_every: 10
  early_stop_patience: 0
  loss_type: mse
  seed: 42
  sampler: uniform_random
  pretrain:
    enabled: false
evaluation:
  batch_size: 16000
  save_predictions: false
log:
  timing:
    enabled: true
    epoch_breakdown: true
    step_window: false
    step_window_every_steps: 100
    cuda_sync: false
