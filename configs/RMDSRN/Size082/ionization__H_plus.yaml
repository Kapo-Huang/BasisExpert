experiment: rmdsrn_ionization-size082_H_plus
exp_id: rmdsrn-ionization-size082-H_plus
experiment_root: ${REPO_ROOT}/runs/rmdsrn
data:
  kind: volume
  dataset_name: ionization
  split: train
  target: H_plus
  targets:
    GT: ${REPO_ROOT}/data/Volume/Ionization/target_GT.npy
    H_plus: ${REPO_ROOT}/data/Volume/Ionization/target_H+.npy
    H2: ${REPO_ROOT}/data/Volume/Ionization/target_H2.npy
    He: ${REPO_ROOT}/data/Volume/Ionization/target_He.npy
    PD: ${REPO_ROOT}/data/Volume/Ionization/target_PD.npy
  volume_shape:
    X: 600
    Y: 248
    Z: 248
    T: 100
model:
  name: rmdsrn
  base_encoder: temporal_fv_srn
  grid_resolution: 14
  grid_channels: 12
  grid_init_std: 0.01
  keyframe_indices:
  - 0
  - 9
  - 18
  - 27
  - 36
  - 45
  - 54
  - 63
  - 72
  - 81
  - 90
  - 99
  fourier_features: 14
  fourier_mode: nerf
  decoder_count: 5
  decoder_hidden_features: 64
  decoder_hidden_layers: 2
  activation: snake_alt
  activation_frequency: 1.0
training:
  steps: 900000
  batch_size: 16000
  lr: 0.005
  beta_1: 0.9
  beta_2: 0.999
  min_lr: 1.0e-07
  lambda_min: 0.0
  lambda_max: 10.0
  lambda_growth_rate: 500.0
  epsilon: 1.0e-12
  save_every: 5000
  log_every: 100
  seed: 42
  device: cuda
evaluation:
  batch_size: 16000
  save_mean: true
  save_variance: true
  run_after_training: false
  default_model: artifact
  uncertainty_sample_size: 1000000
  topk_fractions:
  - 0.01
  - 0.05
  seed: 42
