experiment: rmdsrn_ionization_{target}
exp_id: rmdsrn-ionization-{target}
experiment_root: runs/rmdsrn
data:
  kind: volume
  dataset_name: ionization
  split: train
  target: GT
  targets:
    GT: ../../data/Volume/Ionization/target_GT.npy
    H_plus: ../../data/Volume/Ionization/target_H+.npy
    H2: ../../data/Volume/Ionization/target_H2.npy
    He: ../../data/Volume/Ionization/target_He.npy
    PD: ../../data/Volume/Ionization/target_PD.npy
  volume_shape:
    T: 100
    Z: 248
    Y: 248
    X: 600
model:
  name: rmdsrn
  base_encoder: temporal_fv_srn
  grid_resolution: 32
  grid_channels: 16
  grid_init_std: 0.01
  keyframe_indices: [0, 9, 18, 27, 36, 45, 54, 63, 72, 81, 90, 99]
  fourier_features: 14
  fourier_mode: nerf
  decoder_count: 5
  decoder_hidden_features: 64
  decoder_hidden_layers: 2
  activation: snake_alt
  activation_frequency: 1.0
training:
  steps: 50000
  batch_size: 131072
  lr: 5.0e-3
  beta_1: 0.9
  beta_2: 0.999
  min_lr: 1.0e-7
  lambda_min: 0.0
  lambda_max: 10.0
  lambda_growth_rate: 500.0
  epsilon: 1.0e-12
  save_every: 5000
  log_every: 100
  seed: 42
  device: cuda
evaluation:
  batch_size: 65536
  save_mean: true
  save_variance: true
  run_after_training: true
  default_model: artifact
  uncertainty_sample_size: 1000000
  topk_fractions: [0.01, 0.05]
  seed: 42
log:
  effective_config: true
  model_stats: true
  startup_timing: true
