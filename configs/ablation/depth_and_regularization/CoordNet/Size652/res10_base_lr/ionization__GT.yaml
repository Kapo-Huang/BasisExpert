experiment: exploration_v4_coordnet_size652_res10_base_lr_GT
exp_id: explore-v4-coordnet-size652-res10_base_lr-GT
experiment_root: ${REPO_ROOT}/runs/exploration_v4
data:
  kind: volume
  dataset_name: ionization
  split: train
  volume_shape:
    X: 600
    Y: 248
    Z: 248
    T: 100
  targets:
    GT: ${IONIZATION_ROOT}/target_GT.npy
    H_plus: ${IONIZATION_ROOT}/target_H+.npy
    H2: ${IONIZATION_ROOT}/target_H2.npy
    He: ${IONIZATION_ROOT}/target_He.npy
    PD: ${IONIZATION_ROOT}/target_PD.npy
  target: GT
model:
  name: coordnet
  in_features: 4
  init_features: 43
  num_res: 10
training:
  epochs: 50
  batch_size: 16000
  pred_batch_size: 16000
  num_workers: 0
  lr: 1.0e-05
  val_split: 0.0
  log_every: 1
  log_psnr_every: 5
  psnr_sample_ratio: 0.01
  save_every: 50
  early_stop_patience: 0
  loss_type: mse
  seed: 42
  sampler: budgeted_random
  batches_per_epoch_budget: 1500
  scheduler:
    enabled: true
    step_size: 40
    gamma: 0.92
evaluation:
  batch_size: 16000
  save_predictions: false
log:
  timing:
    enabled: true
    epoch_breakdown: true
    step_window: false
    step_window_every_steps: 100
    cuda_sync: false
exploration_probe:
  enabled: true
  total_epoch_equivalents: 50
  every_epoch_equivalents: 5
  sample_ratio: 0.01
  max_samples: 100000
  seed: 42
  retain_best_checkpoint: true
